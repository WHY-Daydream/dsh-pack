# Real GHCR Protocol E2E（DESIGN-v0.4.2.md §4B/§5–§7，D41–D44）：
# 只在 workflow_dispatch 手动触发（v0.4.2 初期先手动跑，稳定后挂 release tag）。
# GITHUB_TOKEN + packages:write；测试 namespace ghcr.io/<owner>/dsh-pack-e2e:run-<run_id>（§6）。
# 普通 PR CI 不碰真实 GHCR（pr-ci.yml）；fork PR 无法触发本 workflow（D43）。
#
# 环境布局（2026-08-30 修复）：dsh-pack 的 devDependencies 通过
#   link:../deepseek-harness/<pkg>  依赖 sibling DeepSeek Harness 源码树。
# CI 必须双 checkout（dsh-pack + deepseek-harness@<pin>）并先 build harness
# 的 host face（lib/ 被其 .gitignore 忽略，checkout 后无构建产物）。
# pin commit 47f943859b = 本地验证使用的 release: dsh@0.1.0-rc.5。
name: Real GHCR E2E

on:
  workflow_dispatch:
  # 稳定后挂 release tag（DESIGN §4B）：
  # push:
  #   tags: ["v*"]

permissions:
  contents: read
  # D42：GITHUB_TOKEN + packages:write（pull 的 packages:read 被 write 覆盖）
  packages: write

jobs:
  ghcr-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-pack
    steps:
      - name: Checkout dsh-pack
        uses: actions/checkout@v4
        with:
          path: dsh-pack

      - name: Checkout deepseek-harness (pinned)
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          # pin：release dsh@0.1.0-rc.5（与本地验证一致，保证 CI 可复现）
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: deepseek-harness

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dsh-pack/pnpm-lock.yaml

      - name: DSH dependency preflight
        run: |
          set -e
          echo "DSH dependency preflight"
          test -f ../deepseek-harness/package.json && echo "OK ../deepseek-harness" || { echo "FAIL: deepseek-harness sibling checkout missing"; exit 1; }
          for d in vendor/cordis vendor/include vendor/loader packages/boot/app-boot packages/interaction/commands packages/util/home-paths; do
            test -d "../deepseek-harness/$d" && echo "OK $d" || { echo "FAIL: $d missing in deepseek-harness"; exit 1; }
          done

      - name: Build deepseek-harness host lib (tsc -b + tsdown)
        working-directory: deepseek-harness
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:lib:host

      - name: Install dsh-pack dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Typecheck + build (lib/)
        run: pnpm run typecheck

      - name: Local test suite first (138 tests — business logic gate, D41)
        run: pnpm test

      - name: Real GHCR protocol E2E (Internet North-Star)
        run: node scripts/ghcr-e2e.mjs
        env:
          # D42/D45：job 级 env 注入，结束即消失；不生成持久 registry-auth.json
          DSH_REGISTRY_USERNAME: ${{ github.actor }}
          DSH_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
          RUN_ID: ${{ github.run_id }}
