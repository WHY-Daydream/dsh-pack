# v0.6.0-beta.2 Real GHCR Registry Interoperability gate (I8/I9/I10, D183–D190):
# 只在 workflow_dispatch 手动触发；GITHUB_TOKEN（不用 PAT）+ packages:write；
# 测试 namespace ghcr.io/<owner>/dsh-pack-interop:run-<run_id>（全小写，run-scoped）。
# 普通 PR CI 不碰真实 GHCR（pr-ci.yml）。脚本记录 GHCR 实际能力
# （native-referrers 或 tag-fallback），不预设 vendor capability（D183）。
#
# 环境布局（延续 ghcr-e2e.yml 的经验）：dsh-pack 的 devDependencies 通过
#   link:../deepseek-harness/<pkg>  依赖 sibling DeepSeek Harness 源码树。
# CI 必须双 checkout（dsh-pack + deepseek-harness@<pin>）并先 build harness
# 的 host face（lib/ 被其 .gitignore 忽略，checkout 后无构建产物）。
# pin commit 47f943859b = 本地验证使用的 release: dsh@0.1.0-rc.5。
name: GHCR Registry Interop (beta.2)

on:
  workflow_dispatch:

permissions:
  contents: read
  # D42：GITHUB_TOKEN + packages:write（pull 的 packages:read 被 write 覆盖）
  packages: write

jobs:
  ghcr-interop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-pack
    steps:
      - name: Checkout dsh-pack
        uses: actions/checkout@v4
        with:
          path: dsh-pack

      - name: Checkout deepseek-harness (pinned)
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          # pin：release dsh@0.1.0-rc.5（与本地验证一致，保证 CI 可复现）
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: deepseek-harness

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dsh-pack/pnpm-lock.yaml

      - name: DSH dependency preflight
        run: |
          set -e
          echo "DSH dependency preflight"
          test -f ../deepseek-harness/package.json && echo "OK ../deepseek-harness" || { echo "FAIL: deepseek-harness sibling checkout missing"; exit 1; }
          for d in vendor/cordis vendor/include vendor/loader packages/boot/app-boot packages/interaction/commands packages/util/home-paths; do
            test -d "../deepseek-harness/$d" && echo "OK $d" || { echo "FAIL: $d missing in deepseek-harness"; exit 1; }
          done

      - name: Build deepseek-harness host lib (tsc -b + tsdown)
        working-directory: deepseek-harness
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:lib:host

      - name: Install dsh-pack dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Typecheck + build (lib/)
        run: pnpm run typecheck

      - name: Local test suite first (all mock-registry interop green before GHCR)
        run: pnpm test

      - name: Real GHCR registry interoperability gate (I8/I9/I10)
        run: node scripts/registry-interop-ghcr.mjs
        env:
          # D42/D45：job 级 env 注入，结束即消失；不生成持久 registry-auth.json
          DSH_REGISTRY_USERNAME: ${{ github.actor }}
          DSH_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
          RUN_ID: ${{ github.run_id }}

      - name: "Real GHCR NEGATIVE acceptance gate (R8: tag drift / RC6-N4 revocation / forged C)"
        # rc.1 (D191–D199)：同一 workflow_dispatch 内跑真实 GHCR 负面验收——
        # mutable tag drift 不重写已解析的 immutable M；本地撤销 issuer → 同 bytes DENY；
        # wrong digest 被完整验证链拒绝。记录 GHCR 实际 mode（native/fallback，D183）。
        run: node scripts/registry-interop-ghcr-negative.mjs
        env:
          DSH_REGISTRY_USERNAME: ${{ github.actor }}
          DSH_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
          RUN_ID: ${{ github.run_id }}
