<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1040" width="1440" height="1040" role="img" aria-labelledby="title desc">
  <title id="title">dsh-pack Artifact Supply Chain Architecture</title>
  <desc id="desc">DSH Profile is packed into a signed .dshpack, imported into a local content-addressed image store, distributed via OCI registry, governed by dsh-lock.json and trust.yaml, verified, and run as an Agent image.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d29922"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1440" height="1040" fill="#0d1117"/>

  <!-- ===================== TITLE ===================== -->
  <text x="720" y="42" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="26" font-weight="bold" fill="#e6edf3">dsh-pack — Artifact Supply Chain</text>
  <text x="720" y="66" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="13" fill="#8b949e">Portable · Signed · Runnable · OCI-Distributable · Governed</text>

  <!-- ===================== BAND 1: BUILD / PACKAGE ===================== -->
  <rect x="40" y="96" width="940" height="168" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="56" y="122" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="12" font-weight="bold" fill="#58a6ff" letter-spacing="2">BUILD / PACKAGE</text>

  <!-- Profile -->
  <rect x="70" y="140" width="168" height="56" rx="8" fill="#1f2937" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="154" y="166" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="13" fill="#e6edf3">DSH Profile</text>
  <text x="154" y="184" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="10" fill="#8b949e">bundles + patch + config</text>
  <text x="154" y="222" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="11" fill="#39c5cf">configHash → reproducibility</text>

  <!-- pack -->
  <line x1="238" y1="168" x2="272" y2="168" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="274" y="140" width="120" height="56" rx="8" fill="#1f2937" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="334" y="166" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="13" fill="#e6edf3">/pack</text>
  <text x="334" y="184" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="10" fill="#8b949e">deterministic archive</text>

  <!-- .dshpack -->
  <line x1="394" y1="168" x2="428" y2="168" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="430" y="140" width="180" height="56" rx="8" fill="#1f2937" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="520" y="166" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="13" fill="#e6edf3">.dshpack</text>
  <text x="520" y="184" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="10" fill="#8b949e">portable artifact</text>
  <text x="520" y="222" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="11" fill="#39c5cf">contentHash → DSH identity</text>

  <!-- sign -->
  <line x1="610" y1="168" x2="644" y2="168" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="646" y="140" width="210" height="56" rx="8" fill="#1f2937" stroke="#3fb950" stroke-width="1.5"/>
  <text x="751" y="166" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="13" fill="#e6edf3">Ed25519 Sign</text>
  <text x="751" y="184" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="10" fill="#8b949e">signer + provenance</text>

  <!-- band1 → band2 connector -->
  <line x1="520" y1="264" x2="520" y2="300" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===================== BAND 2: LOCAL IMAGE LAYER ===================== -->
  <rect x="40" y="302" width="940" height="168" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="56" y="328" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="12" font-weight="bold" fill="#3fb950" letter-spacing="2">LOCAL IMAGE LAYER</text>

  <rect x="70" y="346" width="200" height="56" rx="8" fill="#1f2937" stroke="#3fb950" stroke-width="1.5"/>
  <text x="170" y="372" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="13" fill="#e6edf3">Signed Artifact</text>
  <text x="170" y="390" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="10" fill="#8b949e">verified before import</text>

  <line x1="270" y1="374" x2="314" y2="374" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="316" y="346" width="200" height="56" rx="8" fill="#1f2937" stroke="#3fb950" stroke-width="1.5"/>
  <text x="416" y="372" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="13" fill="#e6edf3">Image Import</text>
  <text x="416" y="390" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="10" fill="#8b949e">blob + manifest + ref</text>

  <line x1="516" y1="374" x2="560" y2="374" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="562" y="346" width="290" height="56" rx="8" fill="#1f2937" stroke="#3fb950" stroke-width="1.5"/>
  <text x="707" y="372" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="13" fill="#e6edf3">Local Image Store</text>
  <text x="707" y="390" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="10" fill="#8b949e">content-addressed CAS · refs → manifest → blob</text>

  <!-- prune -->
  <rect x="562" y="414" width="290" height="42" rx="8" fill="#21262d" stroke="#d29922" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="707" y="439" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="12" fill="#d29922">Mark-and-Sweep Prune (local lifecycle)</text>
  <line x1="707" y1="402" x2="707" y2="414" stroke="#d29922" stroke-width="1.5" marker-end="url(#arrAccent)"/>

  <!-- band2 → band3 connector -->
  <line x1="520" y1="470" x2="520" y2="506" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===================== BAND 3: OCI DISTRIBUTION ===================== -->
  <rect x="40" y="508" width="940" height="168" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="56" y="534" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="12" font-weight="bold" fill="#bc8cff" letter-spacing="2">OCI DISTRIBUTION</text>

  <rect x="70" y="552" width="180" height="56" rx="8" fill="#1f2937" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="160" y="578" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="13" fill="#e6edf3">Local Image</text>
  <text x="160" y="596" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="10" fill="#8b949e">named + versioned</text>

  <line x1="250" y1="580" x2="294" y2="580" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="296" y="552" width="180" height="56" rx="8" fill="#1f2937" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="386" y="578" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="13" fill="#e6edf3">OCI Push</text>
  <text x="386" y="596" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="10" fill="#8b949e">blobDigest → transport bytes</text>

  <line x1="476" y1="580" x2="520" y2="580" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="522" y="552" width="330" height="56" rx="8" fill="#1f2937" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="687" y="578" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="13" fill="#e6edf3">OCI Registry / GHCR</text>
  <text x="687" y="596" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="10" fill="#8b949e">manifestDigest → immutable remote identity</text>

  <!-- band3 → policy fork -->
  <line x1="687" y1="608" x2="687" y2="676" stroke="#8b949e" stroke-width="2"/>
  <line x1="380" y1="676" x2="687" y2="676" stroke="#8b949e" stroke-width="2"/>
  <line x1="380" y1="676" x2="380" y2="706" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="687" y1="676" x2="1000" y2="676" stroke="#8b949e" stroke-width="2"/>
  <line x1="1000" y1="676" x2="1000" y2="706" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===================== POLICY ===================== -->
  <rect x="120" y="708" width="520" height="86" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="380" y="734" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="12" font-weight="bold" fill="#d29922" letter-spacing="2">GOVERNANCE</text>

  <rect x="140" y="746" width="230" height="42" rx="8" fill="#21262d" stroke="#d29922" stroke-width="1.5"/>
  <text x="255" y="763" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="12" fill="#e6edf3">dsh-lock.json</text>
  <text x="255" y="780" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="10" fill="#8b949e">Version Policy</text>

  <rect x="390" y="746" width="230" height="42" rx="8" fill="#21262d" stroke="#d29922" stroke-width="1.5"/>
  <text x="505" y="763" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="12" fill="#e6edf3">trust.yaml</text>
  <text x="505" y="780" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="10" fill="#8b949e">Trust Policy</text>

  <!-- policy → verify column -->
  <line x1="255" y1="794" x2="255" y2="824" stroke="#8b949e" stroke-width="2"/>
  <line x1="505" y1="794" x2="505" y2="824" stroke="#8b949e" stroke-width="2"/>
  <line x1="255" y1="824" x2="505" y2="824" stroke="#8b949e" stroke-width="2"/>
  <line x1="380" y1="824" x2="380" y2="856" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===================== VERIFY COLUMN ===================== -->
  <rect x="260" y="858" width="240" height="40" rx="20" fill="#1f2937" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="380" y="883" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="13" fill="#e6edf3">OCI Integrity</text>

  <line x1="380" y1="898" x2="380" y2="910" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="260" y="912" width="240" height="40" rx="20" fill="#1f2937" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="380" y="937" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="13" fill="#e6edf3">DSH Integrity</text>

  <line x1="380" y1="952" x2="380" y2="964" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="260" y="966" width="240" height="40" rx="20" fill="#1f2937" stroke="#3fb950" stroke-width="1.5"/>
  <text x="380" y="991" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="13" fill="#3fb950">Signature: VALID</text>

  <line x1="380" y1="1006" x2="380" y2="1018" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="260" y="1020" width="240" height="40" rx="20" fill="#1f2937" stroke="#3fb950" stroke-width="1.5"/>
  <text x="380" y="1045" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="13" fill="#3fb950">Trust: VERIFIED</text>

  <line x1="380" y1="1060" x2="380" y2="1072" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="260" y="1074" width="240" height="44" rx="22" fill="#238636" stroke="#3fb950" stroke-width="2"/>
  <text x="380" y="1102" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="14" font-weight="bold" fill="#ffffff">Agent Run</text>

  <!-- ===================== RIGHT RAIL: IDENTITY ===================== -->
  <rect x="1020" y="96" width="380" height="230" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="1040" y="122" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="12" font-weight="bold" fill="#39c5cf" letter-spacing="2">IDENTITY RAIL</text>

  <rect x="1040" y="140" width="16" height="16" rx="3" fill="#39c5cf"/>
  <text x="1070" y="153" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="13" fill="#e6edf3">configHash</text>
  <text x="1070" y="170" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="11" fill="#8b949e">reproducible profile semantics</text>

  <rect x="1040" y="186" width="16" height="16" rx="3" fill="#3fb950"/>
  <text x="1070" y="199" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="13" fill="#e6edf3">contentHash</text>
  <text x="1070" y="216" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="11" fill="#8b949e">DSH artifact identity · signing anchor</text>

  <rect x="1040" y="232" width="16" height="16" rx="3" fill="#bc8cff"/>
  <text x="1070" y="245" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="13" fill="#e6edf3">OCI blobDigest</text>
  <text x="1070" y="262" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="11" fill="#8b949e">raw transport bytes</text>

  <rect x="1040" y="278" width="16" height="16" rx="3" fill="#d29922"/>
  <text x="1070" y="291" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="13" fill="#e6edf3">OCI manifestDigest</text>
  <text x="1070" y="308" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="11" fill="#8b949e">immutable remote image identity</text>

  <!-- ===================== RIGHT RAIL: CORE INVARIANTS ===================== -->
  <rect x="1020" y="346" width="380" height="310" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="1040" y="372" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="12" font-weight="bold" fill="#f85149" letter-spacing="2">CORE INVARIANTS</text>

  <text x="1040" y="404" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="13" fill="#e6edf3">Lock ≠ Trust</text>
  <text x="1040" y="436" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="13" fill="#e6edf3">Cache ≠ Trust</text>
  <text x="1040" y="468" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="13" fill="#e6edf3">Registry ≠ Trust Authority</text>
  <text x="1040" y="500" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="13" fill="#e6edf3">VALID ≠ TRUSTED</text>
  <text x="1040" y="532" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="13" fill="#e6edf3">OCI digest ≠ DSH contentHash</text>
  <text x="1040" y="564" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="13" fill="#e6edf3">CLI can tighten, never weaken</text>

  <!-- ===================== FOOTER ===================== -->
  <text x="720" y="1030" text-anchor="middle" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="11" fill="#484f58">dsh-pack v0.4.2 — Real GHCR 8/8 PASS · 140 tests · npm @why-daydream/dsh-pack</text>
</svg>
